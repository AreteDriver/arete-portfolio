name: Field Tests — controlled pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/field-tests-manual.yml'
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: 'Approved upstream project'
        required: true
        type: choice
        options:
          - anthropics/claude-code
          - browser-use/browser-use
          - openai/openai-agents-python
      upstream_commit:
        description: 'Reviewed 40-character upstream commit'
        required: true
        type: string
      input_path:
        description: 'Root-level instruction file'
        required: true
        type: choice
        options:
          - CLAUDE.md
          - AGENTS.md

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONTEXT_HYGIENE_TELEMETRY: '0'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Select reviewed source and validate input
        id: source
        env:
          EVENT: ${{ github.event_name }}
          REQUEST_REPO: ${{ inputs.upstream_repository }}
          REQUEST_SHA: ${{ inputs.upstream_commit }}
          REQUEST_PATH: ${{ inputs.input_path }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            repo='browser-use/browser-use'
            sha='aa093a843da5edbf323c0b4145c9b6a0db3ecde8'
            path='AGENTS.md'
          else
            repo="$REQUEST_REPO"
            sha="$REQUEST_SHA"
            path="$REQUEST_PATH"
          fi
          case "$repo:$sha:$path" in
            'anthropics/claude-code:49b8c35f8c57493c2f0eba1429ccaa9638ab8712:CLAUDE.md'|\
            'browser-use/browser-use:aa093a843da5edbf323c0b4145c9b6a0db3ecde8:AGENTS.md'|\
            'openai/openai-agents-python:64cd5dfc5a1579870dcbed0ea42b27aa84033fee:CLAUDE.md')
              ;;
            *) echo 'Repository, commit, and path combination not approved' >&2; exit 1;;
          esac
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Checkout upstream pinned revision
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.sha }}
          path: upstream
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install versioned analyzer
        run: python -m pip install 'context-hygiene==0.3.2'
      - name: Audit static file and record non-sensitive metadata
        env:
          TARGET: ${{ steps.source.outputs.path }}
          REPO: ${{ steps.source.outputs.repo }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -f "upstream/$TARGET"
          echo "upstream=$REPO"
          echo "commit=$SHA"
          python -m pip show context-hygiene | grep -E '^(Name|Version):'
          sha256sum "upstream/$TARGET"
          set +e
          ctx-hygiene audit "upstream/$TARGET" --format json > audit-stdout.json 2> audit-stderr.txt
          result=$?
          set -e
          echo "audit_exit_code=$result"
          if [[ "$result" -ne 0 ]]; then
            echo 'Audit execution failed; check parser, quota, and dependencies before claiming a result.' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('audit-stdout.json').read_text())
          if not isinstance(report, dict):
              raise SystemExit('Analyzer report is not a JSON object')
          for key in ('total_segments', 'total_tokens', 'tokens_recoverable', 'grade'):
              if key not in report:
                  raise SystemExit(f'Missing required analyzer field: {key}')
          if type(report['total_segments']) is not int or report['total_segments'] <= 0:
              raise SystemExit('Invalid or empty parse: no segments analyzed')
          if type(report['total_tokens']) is not int or report['total_tokens'] <= 0:
              raise SystemExit('Invalid or empty parse: no tokens analyzed')
          if type(report['tokens_recoverable']) is not int or report['tokens_recoverable'] < 0:
              raise SystemExit('Invalid recoverable token estimate')
          if not isinstance(report['grade'], str) or report['grade'] not in ('A','B','C','D','F'):
              raise SystemExit('Invalid grade')
          print('report_valid_json=true')
          print('report_fields='+','.join(sorted(report.keys())))
          for key in ('total_segments','total_tokens','tokens_recoverable','staleness_score','grade'):
              if key in report and isinstance(report[key],(str,int,float)):
                  print(f'{key}={report[key]}')
          for key in ('contradictions','deadweight','compression_candidates','staleness_results'):
              value = report.get(key)
              if not isinstance(value, list):
                  raise SystemExit(f'Missing or malformed findings collection: {key}')
              print(f'{key}_count={len(value)}')
          print('NOTE: heuristic finding counts are unverified; raw report withheld')
          PY
          echo 'Raw findings withheld pending manual verification.'
      - name: Delete unreviewed raw output
        if: always()
        run: rm -f audit-stdout.json audit-stderr.txt
